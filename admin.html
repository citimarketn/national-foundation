<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم — المؤسسة الوطنية</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>body{font-family:'Tajawal',sans-serif}.f{width:100%;border:1px solid #d0d5dd;border-radius:6px;padding:.6rem .8rem;background:#fff}.f:focus{outline:2px solid #C9A227}</style>
</head>
<body class="bg-gray-100 min-h-screen">

<section id="login" class="max-w-sm mx-auto mt-24 bg-white p-6 rounded shadow space-y-3">
  <h1 class="font-bold text-xl text-[#0B2A6B]">دخول المسؤول</h1>
  <input id="em" type="email" class="f" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="pw" type="password" class="f" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="loginBtn" class="w-full bg-[#0B2A6B] text-white py-2 rounded">دخول</button>
  <p id="lerr" class="text-red-600 text-sm"></p>
</section>

<section id="panel" class="hidden max-w-5xl mx-auto p-4">
  <header class="flex justify-between items-center bg-[#0B2A6B] text-white p-4 rounded">
    <b>لوحة التحكم</b><button id="out" class="text-sm underline">خروج</button>
  </header>
  <nav id="tabs" class="flex flex-wrap gap-2 my-4 text-sm"></nav>
  <div class="bg-white rounded shadow p-4">
    <form id="form" class="space-y-3 mb-6"></form>
    <p id="status" class="text-sm mb-3"></p>
    <ul id="list" class="divide-y"></ul>
  </div>
</section>

<script type="module">
import { db, auth, storage } from "./firebase-config.js";
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { collection, addDoc, getDocs, getDoc, setDoc, deleteDoc, doc, query, orderBy, serverTimestamp, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};

// تعريف الأقسام: كل قسم = مجموعة (collection) + حقولها
const SECTIONS = {
  news:    { label:'الأخبار', fields:[['title','العنوان'],['body','النص','area'],['image','صورة الخبر','file']] },
  press:   { label:'البيانات الصحفية', fields:[['title','العنوان'],['body','نص البيان','area']] },
  gallery: { label:'الصور والفيديو', fields:[['caption','وصف'],['media','صورة أو فيديو','file']] },
  stats:   { label:'الإحصائيات', single:true, fields:[['initiatives','عدد المبادرات','num'],['services','الخدمات المقدمة','num'],['beneficiaries','المستفيدون','num']] },
  messages:{ label:'الطلبات الواردة', readonly:true }
};
let current = 'news';

onAuthStateChanged(auth, async u => {
  const ok = !!u && (await getDoc(doc(db,'admins',u.uid))).exists();
  $('#login').classList.toggle('hidden', ok); $('#panel').classList.toggle('hidden', !ok);
  if (u && !ok) { $('#lerr').textContent='هذا الحساب ليس مسؤولًا.'; await signOut(auth); }
  if (ok) { buildTabs(); show('news'); }
});
$('#loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $('#em').value, $('#pw').value); }
  catch(e){ $('#lerr').textContent='بيانات الدخول غير صحيحة.'; }
};
$('#out').onclick = () => signOut(auth);

function buildTabs(){
  const t=$('#tabs'); t.replaceChildren();
  for (const k in SECTIONS){ const b=el('button','px-4 py-2 rounded bg-white border',SECTIONS[k].label); b.onclick=()=>show(k); t.append(b); }
}
const say=(m,ok=true)=>{const s=$('#status');s.textContent=m;s.className='text-sm mb-3 '+(ok?'text-green-700':'text-red-600')};

async function show(k){
  current=k; const S=SECTIONS[k]; const form=$('#form'); form.replaceChildren(); $('#list').replaceChildren(); say('');
  if(!S.readonly){
    S.fields.forEach(([n,l,type])=>{
      const w=el('label','block text-sm'); w.append(l);
      const i = type==='area'?el('textarea','f'): el('input','f');
      if(type==='area') i.rows=5; if(type==='file'){i.type='file';i.accept='image/*,video/*'} if(type==='num') i.type='number';
      i.name=n; w.append(i); form.append(w);
    });
    const b=el('button','bg-[#C9A227] text-[#0B2A6B] font-bold px-5 py-2 rounded',S.single?'حفظ':'نشر'); b.type='submit'; form.append(b);
  }
  if(S.single){ const d=await getDoc(doc(db,'settings','stats')); if(d.exists()) for(const [n] of S.fields) form.elements[n].value=d.data()[n]??''; return; }
  const snap = await getDocs(query(collection(db,k), orderBy('createdAt','desc')));
  snap.forEach(d=>{
    const x=d.data(); const li=el('li','py-3 flex justify-between gap-3 items-start');
    const info=el('div','text-sm'); 
    info.append(el('b','', x.title||x.caption||x.name||x.type||'—'));
    info.append(el('p','text-gray-600',[x.body,x.message,x.phone,x.kind].filter(Boolean).join(' — ')));
    if(x.url){const a=el('a','text-blue-700 underline','فتح الملف');a.href=x.url;a.target='_blank';info.append(a)}
    const del=el('button','text-red-600 text-sm','حذف'); del.onclick=async()=>{ if(confirm('تأكيد الحذف؟')){await deleteDoc(doc(db,k,d.id));show(k)} };
    li.append(info,del); $('#list').append(li);
  });
  if(!snap.size) $('#list').append(el('li','py-3 text-gray-500','لا توجد عناصر بعد.'));
}

$('#form').addEventListener('submit', async e=>{
  e.preventDefault(); const S=SECTIONS[current]; const f=e.target; const data={}; 
  try{
    for(const [n,,type] of S.fields){
      if(type==='file'){
        const file=f.elements[n].files[0]; if(!file) continue;
        say('جارٍ رفع الملف...');
        const r=ref(storage,`${current}/${Date.now()}_${file.name.replace(/[^\w.\-]/g,'_')}`);
        await uploadBytes(r,file); const url=await getDownloadURL(r);
        if(current==='news') data.imageUrl=url; else { data.url=url; data.mediaType=file.type.startsWith('video')?'video':'image'; }
      } else data[n]= type==='num'? Number(f.elements[n].value||0) : f.elements[n].value;
    }
    if(S.single) await setDoc(doc(db,'settings','stats'),data);
    else { if(current==='gallery'&&!data.url) return say('اختر ملفًا أولًا',false); await addDoc(collection(db,current),{...data,createdAt:serverTimestamp()}); f.reset(); }
    say('تم الحفظ بنجاح'); if(!S.single) show(current);
  }catch(err){ say('حدث خطأ: '+err.message,false); }
});
</script>
</body>
</html>
