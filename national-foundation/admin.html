<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم — المؤسسة المصرية الوطنية والتنمية وحقوق الإنسان بالسويس</title>
<meta name="description" content="الموقع الرسمي للمؤسسة المصرية الوطنية والتنمية وحقوق الإنسان بالسويس - مشهرة برقم 810 لسنة 2024">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 min-h-screen">
<section id="login" class="max-w-sm mx-auto mt-24 bg-white p-6 rounded shadow space-y-3">
  <h1 class="font-bold text-xl text-royal">دخول المسؤول</h1>
  <input id="email" type="email" class="field" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="password" type="password" class="field" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="login-btn" class="btn w-full">دخول</button>
  <p id="login-error" class="text-red-600 text-sm"></p>
</section>

<section id="panel" class="hidden max-w-5xl mx-auto p-4">
  <header class="flex justify-between items-center bg-royal text-white p-4 rounded">
    <b>لوحة التحكم</b><button id="logout" class="text-sm underline">خروج</button>
  </header>
  <nav id="tabs" class="flex flex-wrap gap-2 my-4 text-sm"></nav>
  <div class="bg-white rounded shadow p-4">
    <form id="form" class="space-y-3 mb-6"></form>
    <p id="status" class="text-sm mb-3"></p>
    <ul id="list" class="divide-y"></ul>
  </div>
</section>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
