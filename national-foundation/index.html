<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel="icon" href="favicon.ico" sizes="any">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<body class="bg-white">

      <div>
        <div id="slides" class="min-h-[170px]"></div>
        <div class="mt-6 flex gap-3">
          <a href="services.html" class="btn btn-gold">خدماتنا</a>
          <a href="contact.html" class="border border-gold text-gold2 px-5 py-2.5 rounded hover:bg-white/10">تواصل معنا</a>
        </div>
      </div>
      <img src="assets/logo.jpg" alt="شعار المؤسسة" class="w-48 md:w-64 rounded-full border-4 border-gold mx-auto">

        </figure>
        <figure class="flex items-center gap-4">
          <img src="assets/chairman.jpg" alt="المستشار صابر أبو دقة" class="h-24 w-20 object-cover rounded border-2 border-gold">
          <figcaption><b class="font-head text-lg">المستشار / صابر أبو دقة</b><br><span class="text-sm text-white/80">رئيس مجلس الأمناء</span></figcaption>

  <section class="bg-gold/10 border-y border-gold/40">
    <div class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-3 text-center">
      <div><div id="st-initiatives" class="font-head text-4xl text-royal">0</div><div class="text-sm">مبادرة</div></div>
      <div><div id="st-services" class="font-head text-4xl text-royal">0</div><div class="text-sm">خدمة مقدمة</div></div>
      <div><div id="st-beneficiaries" class="font-head text-4xl text-royal">0</div><div class="text-sm">مستفيد</div></div>

  <section class="max-w-6xl mx-auto px-4 py-12">
    <div class="flex justify-between items-end">
      <div><h2 class="font-head text-3xl text-royal">أحدث الأخبار</h2><div class="gold-line"></div></div>
      <a href="media.html" class="text-sm text-royal2 hover:underline">كل الأخبار ←</a>
    </div>
    <div id="news" class="grid md:grid-cols-3 gap-5 mt-6"></div>
